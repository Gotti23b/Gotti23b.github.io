<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anotador</title>
<style>
body{margin:0;min-height:100vh;background:#f2f2f2;color:#222;font-family:Arial;display:flex;flex-direction:column;align-items:center}
.contenedor{width:90%;max-width:700px;margin-top:40px}h1{text-align:center}
textarea{width:100%;height:400px;box-sizing:border-box;resize:vertical;padding:18px;font-size:18px;font-family:Arial;border:2px solid #ccc;border-radius:12px;outline:none;background:white}
textarea:focus{border-color:#555}#estado{margin-top:10px;color:#555;text-align:center}
.volver{display:block;width:fit-content;margin:30px auto;padding:12px 22px;background:#222;color:white;text-decoration:none;border-radius:10px;font-weight:bold}
</style></head>
<body>
<div class="contenedor"><h1>📝 Anotador</h1>
<textarea id="notas" placeholder="Escribí tus notas acá..."></textarea>
<div id="estado">Cargando...</div>
<a class="volver" href="main.html">← Volver al menú</a></div>
<script>
const notas=document.getElementById("notas"),estado=document.getElementById("estado");
const guardadas=localStorage.getItem("misNotas");
if(guardadas!==null){notas.value=guardadas;estado.textContent="Notas cargadas"}else{estado.textContent="Todavía no hay notas guardadas"}
notas.addEventListener("input",()=>{localStorage.setItem("misNotas",notas.value);estado.textContent="Guardado automáticamente"});
</script>
</body></html>
